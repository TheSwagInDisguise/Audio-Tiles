name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore from Secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > /tmp/release.jks
          ls -l /tmp/release.jks

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: /tmp/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi
          CLEAN_VER="${VERSION#v}"
          export VERSION_NAME="$CLEAN_VER"
          # Convert semantic version 1.0.2 -> 10002
          IFS='.' read -r major minor patch <<< "$CLEAN_VER"
          export VERSION_CODE=$(( ${major:-1} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "Building Release APK with VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Clean User-Facing Release Assets
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi

          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$RAW_APK"

          mkdir -p dist
          FINAL_APK="dist/Sony-XM6-NoiseControl-${VERSION}.apk"
          cp "$RAW_APK" "$FINAL_APK"

          # Compute SHA-256 for the final named asset
          (cd dist && sha256sum "Sony-XM6-NoiseControl-${VERSION}.apk" > "Sony-XM6-NoiseControl-${VERSION}-sha256.txt")
          ls -la dist/

      - name: Cleanup Redundant Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up redundant assets from existing releases..."
          gh release delete-asset v1.0.0 app-release.apk -y || true
          gh release delete-asset v1.0.0 app-release-sha256.txt -y || true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Sony XM6 Noise Control ${{ github.ref_name || inputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎧 Sony WH-1000XM6 Quick Settings Noise Control Tile

            #### Highlights
            - **Quick Settings Tile (`TileService`)**: Cycle between Noise Cancelling, Ambient Sound, and Off directly from the notification shade.
            - **Resilient Multi-Tier RFCOMM**: Prioritizes cached Sony V2 UUIDs (`956c7b26-d49a-4ba8-b03f-b17d393cb6e2`) with Insecure RFCOMM negotiation (bypasses Android 14+ link-key authentication collisions on paired audio devices) and direct channel reflection fallbacks.
            - **Hardware Sync**: Real-time listening for physical headphone button clicks (`0x69` notification frames).
            - **ColorOS / Oppo Find X9 Ultra Optimizations**: WakeLock protection during tile interactions, background battery exemption deep-links, and conflict mitigation for background Songpal/Sound Connect processes.
            - **Persistent Signing Key**: Built and signed with the official persistent keystore stored in repository secrets. Clean update path (`INSTALL_FAILED_UPDATE_INCOMPATIBLE` prevented).

            #### Verification
            - **Certificate SHA-256**: `77:57:BB:B8:9E:01:6F:7B:E4:F0:B6:7E:1A:18:17:3A:D5:DD:44:80:50:DF:B8:E8:15:A5:07:33:B8:51:D5:7D`
            - **Certificate SHA-1**: `39:DE:D8:30:54:BD:DA:9C:4E:83:04:52:10:BB:7E:EF:11:2B:83:3A`
          files: |
            dist/Sony-XM6-NoiseControl-*.apk
            dist/Sony-XM6-NoiseControl-*-sha256.txt
