name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore from Secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > /tmp/release.jks
          ls -l /tmp/release.jks

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: /tmp/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi
          CLEAN_VER="${VERSION#v}"
          export VERSION_NAME="$CLEAN_VER"
          # Convert semantic version 1.0.2 -> 10002
          IFS='.' read -r major minor patch <<< "$CLEAN_VER"
          export VERSION_CODE=$(( ${major:-1} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "Building Release APK with VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Clean User-Facing Release Assets
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.version }}"
          fi

          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$RAW_APK"

          mkdir -p dist
          FINAL_APK="dist/Sony-Audio-Tiles-${VERSION}.apk"
          cp "$RAW_APK" "$FINAL_APK"

          # Compute SHA-256 for release asset
          (cd dist && sha256sum "Sony-Audio-Tiles-${VERSION}.apk" > "Sony-Audio-Tiles-${VERSION}-sha256.txt")
          ls -la dist/

      - name: Cleanup Redundant Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up redundant assets from existing releases..."
          gh release delete-asset v1.0.0 app-release.apk -y || true
          gh release delete-asset v1.0.0 app-release-sha256.txt -y || true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Sony Audio Tiles ${{ github.ref_name || inputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎧 Sony Audio Tiles - Universal Quick Settings & Sound Connect Hub

            #### Highlights
            - **Universal Sony Ecosystem**: Seamless support for WH-1000XM6, WH-1000XM5, WH-1000XM4, WH-1000XM3, WF-1000XM5, WF-1000XM4, LinkBuds, ULT WEAR, and WH-CH720N.
            - **10-Band Graphic Equalizer with Live Spline Curve**: ISO center frequencies (31Hz to 16kHz) with intelligent downsampling to Sony hardware DSP.
            - **PEQDB & AutoEq Catalog Search**: Load parametric EQ curves (.peqdb, .json, .txt) with biquad filter transfer function modeling and built-in headphone database.
            - **Real-Time MDR Diagnostics & Dump Export**: Comprehensive packet inspector with one-tap export for rapid troubleshooting.
            - **Model Capability Discovery**: Automatic hardware feature detection and UI adaptation.
            - **Local Preset Library & A/B Bypass Audition**: Save unlimited custom sound profiles and compare against flat bypass instantly.
            - **Sub-50ms Quick Settings Tile (`TileService`)**: Non-blocking noise mode cycling from notification shade.
            - **ColorOS Guardrails**: Insecure RFCOMM negotiation and 120s Smart Power Saver.

            #### Verification
            - **Certificate SHA-256**: `77:57:BB:B8:9E:01:6F:7B:E4:F0:B6:7E:1A:18:17:3A:D5:DD:44:80:50:DF:B8:E8:15:A5:07:33:B8:51:D5:7D`
            - **Certificate SHA-1**: `39:DE:D8:30:54:BD:DA:9C:4E:83:04:52:10:BB:7E:EF:11:2B:83:3A`
          files: |
            dist/Sony-Audio-Tiles-*.apk
            dist/Sony-Audio-Tiles-*-sha256.txt
